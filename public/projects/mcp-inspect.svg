<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="MCP Inspector">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- burbujas de chat: cliente (derecha, azul) y servidor (izquierda, morado) -->
  <g transform="translate(150,120)">
    <rect x="0" y="0" width="150" height="44" rx="10" fill="#a855f7"/>
    <rect x="12" y="14" width="90" height="6" rx="3" fill="#0d1117" opacity="0.55"/>
    <rect x="12" y="26" width="60" height="6" rx="3" fill="#0d1117" opacity="0.35"/>
  </g>
  <g transform="translate(340,180)">
    <rect x="0" y="0" width="150" height="44" rx="10" fill="#58a6ff"/>
    <rect x="12" y="14" width="100" height="6" rx="3" fill="#0d1117" opacity="0.55"/>
    <rect x="12" y="26" width="70" height="6" rx="3" fill="#0d1117" opacity="0.35"/>
  </g>
  <!-- línea de conexión interceptada -->
  <path d="M300 150 L410 180" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 5" opacity="0.6"/>
  <!-- lupa (inspección) -->
  <g transform="translate(265,105)">
    <circle cx="35" cy="35" r="32" fill="none" stroke="#e9d5ff" stroke-width="6"/>
    <line x1="59" y1="59" x2="84" y2="84" stroke="#e9d5ff" stroke-width="10" stroke-linecap="round"/>
    <rect x="18" y="24" width="34" height="7" rx="3.5" fill="#e9d5ff" opacity="0.5"/>
    <rect x="18" y="38" width="22" height="7" rx="3.5" fill="#e9d5ff" opacity="0.35"/>
  </g>
  <text x="320" y="320" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#e9d5ff">MCP Inspector</text>
  <text x="320" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#58a6ff">Electron · React · JSON-RPC 2.0</text>
</svg>