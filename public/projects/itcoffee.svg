<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="itCoffee">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#422006"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- taza de café -->
  <g transform="translate(250,120)">
    <path d="M10 30 q10 -12 20 0 q10 -12 20 0" stroke="#fbbf24" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M70 26 q10 -12 20 0 q10 -12 20 0" stroke="#fbbf24" stroke-width="4" fill="none" opacity="0.5"/>
    <path d="M0 40 h120 v45 a20 20 0 0 1 -20 20 h-80 a20 20 0 0 1 -20 -20 z" fill="#f59e0b"/>
    <path d="M120 50 h12 a16 16 0 0 1 0 32 h-14" stroke="#f59e0b" stroke-width="7" fill="none"/>
    <rect x="0" y="40" width="120" height="12" rx="6" fill="#fbbf24" opacity="0.85"/>
  </g>
  <!-- grano de café -->
  <g transform="translate(180,210)">
    <ellipse cx="0" cy="0" rx="16" ry="24" fill="#78350f" stroke="#fbbf24" stroke-width="3" transform="rotate(-25)"/>
    <path d="M-6 -18 q8 18 0 36" stroke="#fbbf24" stroke-width="3" fill="none" transform="rotate(-25)"/>
  </g>
  <!-- grano 2 -->
  <g transform="translate(445,195)">
    <ellipse cx="0" cy="0" rx="16" ry="24" fill="#78350f" stroke="#fbbf24" stroke-width="3" transform="rotate(20)"/>
    <path d="M-6 -18 q8 18 0 36" stroke="#fbbf24" stroke-width="3" fill="none" transform="rotate(20)"/>
  </g>
  <text x="320" y="320" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#fde68a">itCoffee</text>
  <text x="320" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#f59e0b">Next.js · NestJS · PostgreSQL</text>
</svg>